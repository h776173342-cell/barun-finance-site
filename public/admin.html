<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>바른금융 상담센터 관리자</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182235;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}.wrap{max-width:1050px;margin:36px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:24px;box-shadow:0 8px 28px #14213d0a}h1{font-size:24px;margin:0 0 8px}p{color:#667085}.login{max-width:420px;margin:7vh auto}.field{display:block;margin:16px 0 6px;font-weight:600}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}button{border:0;border-radius:9px;background:#2459a9;color:white;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#e9eef7;color:#21324b}.wide{width:100%;margin-top:18px}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.msg{min-height:24px;color:#b42318}.tablewrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e7ebf1;font-size:14px}th{background:#f8fafc;color:#475467}.muted{font-size:13px;color:#667085}.count{font-weight:700;color:#2459a9}@media(max-width:600px){.wrap{margin:18px auto}.panel{padding:18px}h1{font-size:21px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginPanel" class="panel login">
      <h1>바른금융 상담센터</h1><p>관리자 로그인</p>
      <form id="loginForm">
        <label class="field" for="username">관리자 아이디</label><input id="username" autocomplete="username" required>
        <label class="field" for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
        <button class="wide" type="submit">로그인</button><div id="loginMsg" class="msg" role="status"></div>
      </form>
      <div class="muted">공용 로그인 정보를 사용하는 관리자 전용 화면입니다.</div>
    </section>
    <section id="dataPanel" class="panel hidden">
      <div class="top"><div><h1>상담 신청 내역</h1><p>최근 신청 내역 최대 500건</p></div><div><button id="refreshBtn" class="secondary">새로고침</button> <button id="logoutBtn">로그아웃</button></div></div>
      <div id="dataMsg" class="msg" role="status"></div><div class="count" id="count"></div>
      <div class="tablewrap"><table><thead><tr><th>접수일시</th><th>이름</th><th>전화번호</th><th>상태</th><th>접수번호</th></tr></thead><tbody id="rows"></tbody></table></div>
      <p class="muted">개인정보가 포함되어 있습니다. 공용 기기에서는 사용 후 로그아웃해 주세요.</p>
    </section>
  </main>
<script>
const $ = id => document.getElementById(id);
async function api(path, options={}) {
  const response = await fetch(path, { credentials:'same-origin', cache:'no-store', ...options, headers:{'Content-Type':'application/json', ...(options.headers||{})} });
  let data={}; try{data=await response.json()}catch{}
  if(!response.ok) throw new Error(data.message || '요청을 처리하지 못했습니다.');
  return data;
}
function showData(){ $('loginPanel').classList.add('hidden'); $('dataPanel').classList.remove('hidden'); loadApplications(); }
function showLogin(){ $('dataPanel').classList.add('hidden'); $('loginPanel').classList.remove('hidden'); }
async function loadApplications(){
  $('dataMsg').textContent='불러오는 중입니다…'; $('rows').replaceChildren();
  try {
    const data=await api('/api/admin/applications'); const apps=data.applications||[];
    $('count').textContent=`총 ${apps.length}건`;
    for(const app of apps){
      const tr=document.createElement('tr');
      const date=app.created_at ? new Date(app.created_at).toLocaleString('ko-KR') : '-';
      for(const value of [date,app.name,app.phone,app.status,app.id]){const td=document.createElement('td');td.textContent=value||'-';tr.appendChild(td)}
      $('rows').appendChild(tr);
    }
    $('dataMsg').textContent=apps.length?'':'아직 상담 신청 내역이 없습니다.';
  } catch(e){ $('dataMsg').textContent=e.message; if(e.message.includes('로그인')) showLogin(); }
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('loginMsg').textContent='로그인 확인 중…';
  try { await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})}); $('password').value=''; showData(); }
  catch(err){$('loginMsg').textContent=err.message;}
});
$('refreshBtn').addEventListener('click',loadApplications);
$('logoutBtn').addEventListener('click',async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'});}finally{showLogin();$('loginMsg').textContent='로그아웃했습니다.';}});
// If a valid session cookie already exists, the protected endpoint will load; otherwise show login.
api('/api/admin/applications').then(data=>{ $('loginPanel').classList.add('hidden'); $('dataPanel').classList.remove('hidden'); const apps=data.applications||[]; $('count').textContent=`총 ${apps.length}건`; for(const app of apps){const tr=document.createElement('tr');for(const value of [app.created_at?new Date(app.created_at).toLocaleString('ko-KR'):'-',app.name,app.phone,app.status,app.id]){const td=document.createElement('td');td.textContent=value||'-';tr.appendChild(td)}$('rows').appendChild(tr)}$('dataMsg').textContent=apps.length?'':'아직 상담 신청 내역이 없습니다.';}).catch(()=>showLogin());
</script>
</body>
</html>
